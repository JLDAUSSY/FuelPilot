  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-card: #131b2e;
      --bg-subcard: rgba(255, 255, 255, 0.03);
      --accent: #0284c7;
      --accent-glow: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(56, 189, 248, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.7;
      padding: 24px 16px 60px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 34px 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.4);
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
    }
    h1 span { color: var(--accent-glow); }
    .badge-tag {
      display: inline-block;
      font-size: 0.78rem;
      background: rgba(14, 165, 233, 0.15);
      color: var(--accent-glow);
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 4px;
      font-weight: 600;
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .lang-btn {
      background: transparent;
      border: none;
      font-size: 1.15rem;
      padding: 4px 8px;
      border-radius: 14px;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.2s;
    }
    .lang-btn:hover { opacity: 0.9; transform: scale(1.08); }
    .lang-btn.active {
      opacity: 1;
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
      transform: scale(1.05);
    }
    h2 {
      font-size: 1.22rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 30px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-top: 18px;
      margin-bottom: 8px;
    }
    p, li {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    ul, ol {
      margin-left: 22px;
      margin-bottom: 16px;
    }
    li { margin-bottom: 8px; }
    strong { color: var(--text); }

    /* Feature Grid Cards */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin: 18px 0 24px;
    }
    .feature-card {
      background: var(--bg-subcard);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .feature-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .feature-icon {
      font-size: 1.6rem;
      margin-bottom: 8px;
      display: inline-block;
    }
    .feature-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .feature-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 0;
    }

    /* Country & Update Table */
    .table-container {
      overflow-x: auto;
      margin: 16px 0 24px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }
    th {
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      padding: 12px 14px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .status-live { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .status-ref { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }

    .callout {
      background: rgba(14, 165, 233, 0.08);
      border-left: 4px solid var(--accent-glow);
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      margin: 18px 0;
    }
    .callout p { margin: 0; color: #cbd5e1; font-size: 0.92rem; }


    /* Screenshots Gallery */
    .screenshots-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 18px 0 26px;
    }
    .screenshot-card {
      background: var(--bg-subcard);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      break-inside: avoid;
    }
    .screenshot-card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      display: block;
    }
    .screenshot-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin: 0;
    }
    .screenshot-caption strong {
      display: block;
      color: #38bdf8;
      font-size: 0.86rem;
      margin-bottom: 2px;
    }

    /* Footer Buttons */
    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.5);
    }
    .btn-secondary {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .btn-secondary:hover { color: #38bdf8; }

    @media (max-width: 600px) {
      .container { padding: 22px 16px; border-radius: 16px; }
      h1 { font-size: 1.25rem; }
      .features-grid { grid-template-columns: 1fr; }
      .screenshots-gallery { grid-template-columns: 1fr; }
      .footer-actions { flex-direction: column; align-items: stretch; text-align: center; }
      .btn-back { justify-content: center; }
    }
  
    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .container {
        max-width: 100% !important;
        background: #ffffff !important;
        border: none !important;
        box-shadow: none !important;
        padding: 10px !important;

      header {

      h1 span { color: #0284c7 !important; }
      .author-tag {
        color: #0284c7 !important;

        font-weight: 600 !important;
        margin-top: -2px !important;
        margin-bottom: 4px !important;
      }
      h2 {
        color: #0369a1 !important;
        break-after: avoid;
        margin-top: 18px !important;
      }
      h3 {
        color: #0f172a !important;
      }
      p, li {
        color: #1e293b !important;
      }
      strong, b {
        color: #0f172a !important;
        font-weight: 700 !important;
      }
      .badge-tag {
        background: #e0f2fe !important;
        color: #0369a1 !important;
        border: 1px solid #bae6fd !important;
      }
      .lang-switcher, .footer-actions {
        display: none !important;
      }
      .features-grid {
        display: grid !important;

        gap: 10px !important;
      }
      .feature-card {
        background: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        color: #334155 !important;
        break-inside: avoid;
        padding: 12px !important;
      }

      table {

      th {

      }
      .screenshots-gallery {

        gap: 10px !important;
        break-inside: avoid;

        border: 1px solid #94a3b8 !important;

        border: 1px solid #fcd34d !important;
      }
    }

  </style>
</head>

  <script>
    const GUIDE_TEXTS = {
      fr: {
        docTitle: "Mode d'emploi & Guide • FuelCoPilot",
        headerTitle: "FuelCo<span>Pilot</span> • Mode d'emploi",
        badgeVersion: "Guide officiel d'utilisation • v9.9.30 (Novembre 2026)",
        backBtn: "Retourner à l'application",
        privacyLink: "Politique de Confidentialité",
        html: `
          <h2>✨ Nouveautés v9.9.30 — Conduite & Alertes Vocales</h2>
          <div class="features-grid">
            <div class="feature-card">
              <span class="feature-icon">🔔</span>
              <div class="feature-title">Alertes vocales (3 stations max)</div>
              <p class="feature-desc">Cochez <strong>« M'avertir 2 km avant »</strong> sur jusqu'à <strong>3 stations</strong> de votre trajet : un carillon et une annonce vocale native vous préviennent à 2 km (bouton <strong>🔊 Tester</strong> inclus). Si le carburant choisi pourrait ne pas être disponible aujourd'hui dans la station cochée, une alerte vocale vous avertit immédiatement.</p>
            </div>
            <div class="feature-card">
              <span class="feature-icon">🔄</span>
              <div class="feature-title">Centrage GPS permanent & Recalcul rapide</div>
              <p class="feature-desc">Votre position reste centrée en permanence à l'écran (mise en pause automatique si vous déplacez la carte au doigt, reprise en 1 clic sur la cible). En cas d'écart d'itinéraire (dès <strong>90 m en ville</strong> ou <strong>200 m sur autoroute</strong>), l'itinéraire est recalculé en moins d'une seconde comme dans Waze ou Google Maps.</p>
            </div>
            <div class="feature-card">
              <span class="feature-icon">🔎</span>
              <div class="feature-title">Recherche commerces, parkings & adresses</div>
              <p class="feature-desc">Recherchez directement un <strong>commerce, une pharmacie, un parking, un restaurant ou une adresse précise</strong> : les résultats les plus proches de votre position GPS remontent automatiquement en tête de liste avec la distance.</p>
            </div>
            <div class="feature-card">
              <span class="feature-icon">❌</span>
              <div class="feature-title">Carburant indisponible & Enseignes réelles</div>
              <p class="feature-desc">Si le carburant sélectionné est absent d'une station, son nom s'affiche <strong>barré d'une croix rouge</strong> sur la carte et dans la liste. Les vraies enseignes (Total, Esso, Intermarché, Shell…) s'affichent automatiquement, y compris hors autoroute.</p>
            </div>
          </div>

          <h2>🎯 1. Qu'est-ce que FuelCoPilot ?</h2>
          <p><strong>FuelCoPilot</strong> est votre copilote autoroutier intelligent, conçu pour vous faire réaliser de vraies économies sur vos longs trajets en Europe. Alors que les prix sur autoroute peuvent varier de plus de <strong>0,20 € à 0,35 € par litre</strong> d'une aire à la suivante, FuelCoPilot vous permet d'anticiper vos ravitaillements en toute sérénité.</p>
          <div class="callout">
            <p>💡 <strong>Le saviez-vous ?</strong> Sur un plein de 50 litres, faire le choix de la bonne station sur autoroute permet d'économiser entre <strong>10 € et 18 €</strong> sur un seul trajet !</p>
          </div>

          <h2>📸 Aperçu de l'interface</h2>
          <div class="screenshots-gallery">
            <div class="screenshot-card">
              <img src="guide_img_search.png" alt="1. Choix de l'itinéraire & Filtres">
              <p class="screenshot-caption"><strong>1. Choix de l'itinéraire & Filtres</strong>Saisie d'adresse/POI, Ma position actuelle, 52 corridors de référence (13 pays), filtre enseigne et carburant.</p>
            </div>
            <div class="screenshot-card">
              <img src="guide_img_map.png" alt="2. Carte interactive & 13 pays">
              <p class="screenshot-caption"><strong>2. Carte interactive & 13 pays</strong>Visualisation des 13 pays couverts, prix en direct sur le trajet, suivi GPS bleu et boutons de centrage.</p>
            </div>
            <div class="screenshot-card">
              <img src="guide_img_list.png" alt="3. Liste chronologique & Alertes 2 km">
              <p class="screenshot-caption"><strong>3. Liste chronologique & Alertes 2 km</strong>Stations classées dans l'ordre du trajet, météo locale, guidage Waze/Maps et alerte vocale 2 km (1/3).</p>
            </div>
          </div>


          <h2>🚀 2. Fonctionnalités et Utilisation pas-à-pas</h2>
          
          <div class="features-grid">
            <div class="feature-card">
              <span class="feature-icon">🛣️</span>
              <div class="feature-title">1. Calcul d'itinéraire A → B</div>
              <p class="feature-desc">Saisissez votre ville ou adresse de départ et d'arrivée avec saisie prédictive. Ajoutez des <strong>étapes intermédiaires illimitées</strong> et comparez les itinéraires alternatifs proposés.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">⏱️</span>
              <div class="feature-title">2. Ordre chronologique strict</div>
              <p class="feature-desc">Les aires apparaissent exactement dans l'ordre où vous allez les rencontrer sur votre sens de circulation. Fini le doute de savoir si la prochaine aire est dans 10 km ou 80 km !</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">📍</span>
              <div class="feature-title">3. Vraies Bornes PK d'autoroute</div>
              <p class="feature-desc">Affichage du <strong>Point Kilométrique officiel (PK)</strong> (ex: <em>A6 • Borne km 311</em>). Vous vous repérez instantanément grâce aux bornes physiques visibles sur le bord de la chaussée.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">🎯</span>
              <div class="feature-title">4. Compte à rebours « Dans X km »</div>
              <p class="feature-desc">Chaque station indique la distance restante précise (ex: <em>Dans 42 km</em>). Cette distance se réduit automatiquement et en direct au fur et à mesure que vous roulez.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">🟢</span>
              <div class="feature-title">5. Suivi GPS en direct (Démarrer)</div>
              <p class="feature-desc">Appuyez sur <strong>Démarrer</strong> : une pastille pulsante matérialise votre voiture sur la carte. Les stations que vous venez de dépasser disparaissent automatiquement de la liste pour ne garder que les aires à venir.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">🧭</span>
              <div class="feature-title">6. Guidage 1-clic Waze & Maps</div>
              <p class="feature-desc">Chaque station propose des boutons directs vers <strong>Waze</strong> et <strong>Google Maps</strong> pour lancer le guidage jusqu'aux pompes d'un simple geste.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">⛽</span>
              <div class="feature-title">7. Filtres Carburant & Enseigne</div>
              <p class="feature-desc">Sélectionnez votre carburant (Gazole, SP95-E10, SP98, SP95, E85, GPLc) ou filtrez selon vos cartes pétrolières préférées (TotalEnergies, Shell, Avia, Repsol, Eni, BP, Esso, Aral...).</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">⭐</span>
              <div class="feature-title">8. Prix le plus bas & Ruptures</div>
              <p class="feature-desc">La station la plus économique de tout votre parcours est mise en avant par un badge doré <strong>⭐ PRIX LE PLUS BAS</strong>. Les carburants en rupture de stock sont signalés en rouge.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">🚪</span>
              <div class="feature-title">9. Stations hors autoroute (< 1,5 km)</div>
              <p class="feature-desc">Repérez les stations situées immédiatement après le péage (< 1,5 km) avec indication précise du <strong>numéro officiel de la sortie d'autoroute</strong> pour réaliser jusqu'à 30 centimes/litre d'économies sans allonger votre temps de parcours.</p>
            </div>

            <div class="feature-card">
              <span class="feature-icon">☁️</span>
              <div class="feature-title">10. Météo & Services en Direct</div>
              <p class="feature-desc">Consultez la météo en temps réel (Open-Meteo) sur chaque aire d'autoroute ainsi que les horaires d'ouverture et enseignes de restauration pour planifier vos pauses en toute sérénité.</p>
            </div>

    function getSelectedLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      if (urlLang && GUIDE_TEXTS[urlLang.toLowerCase()]) {
        return urlLang.toLowerCase();
      }
      try {
        const stored = localStorage.getItem('fuelpilot_lang');
        if (stored && GUIDE_TEXTS[stored.toLowerCase()]) {
          return stored.toLowerCase();
        }
      } catch (e) {}
      const navLang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
      return GUIDE_TEXTS[navLang] ? navLang : 'fr';
    }

    function applyLanguage(lang) {
      const data = GUIDE_TEXTS[lang] || GUIDE_TEXTS.fr;
      document.documentElement.lang = lang;
      document.getElementById('doc-title').textContent = data.docTitle;
      document.getElementById('title-main').innerHTML = data.headerTitle;
      document.getElementById('badge-version').textContent = data.badgeVersion;
      document.getElementById('content-body').innerHTML = data.html;
      
      const backBtn = document.getElementById('btn-back-app');
      backBtn.href = `index.html?lang=${lang}&_v=${Date.now()}`;
      document.getElementById('lbl-back-btn').textContent = data.backBtn;

      const privLink = document.getElementById('link-privacy');
      privLink.textContent = data.privacyLink;
      privLink.href = `privacy.html?lang=${lang}`;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      try {
        localStorage.setItem('fuelpilot_lang', lang);
      } catch (e) {}
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyLanguage(btn.dataset.lang);
      });
    });

    applyLanguage(getSelectedLanguage());
  </script>
