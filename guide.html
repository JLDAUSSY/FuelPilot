    function getSelectedLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      if (urlLang && GUIDE_TEXTS[urlLang.toLowerCase()]) {
        return urlLang.toLowerCase();
      }
      try {
        const stored = localStorage.getItem('fuelpilot_lang');
        if (stored && GUIDE_TEXTS[stored.toLowerCase()]) {
          return stored.toLowerCase();
        }
      } catch (e) {}
      const navLang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
      return GUIDE_TEXTS[navLang] ? navLang : 'fr';
    }

    function applyLanguage(lang) {
      const data = GUIDE_TEXTS[lang] || GUIDE_TEXTS.fr;
      document.documentElement.lang = lang;
      document.getElementById('doc-title').textContent = data.docTitle;
      document.getElementById('title-main').innerHTML = data.headerTitle;
      document.getElementById('badge-version').textContent = data.badgeVersion;
      document.getElementById('content-body').innerHTML = data.html;
      
      const backBtn = document.getElementById('btn-back-app');
      backBtn.href = `index.html?lang=${lang}&_v=${Date.now()}`;
      document.getElementById('lbl-back-btn').textContent = data.backBtn;

      const privLink = document.getElementById('link-privacy');
      privLink.textContent = data.privacyLink;
      privLink.href = `privacy.html?lang=${lang}`;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      try {
        localStorage.setItem('fuelpilot_lang', lang);
      } catch (e) {}
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyLanguage(btn.dataset.lang);
      });
    });

    applyLanguage(getSelectedLanguage());
  </script>
