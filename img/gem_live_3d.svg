<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer metallic bezel gradient -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="90%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Inner groove shadow -->
    <radialGradient id="innerRecess" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </radialGradient>
    <!-- 3D glossy emerald dome -->
    <radialGradient id="greenSphere" cx="42%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <!-- Specular highlight reflection (top crescent) -->
    <linearGradient id="topGloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Bottom inner reflection for 3D realism -->
    <radialGradient id="bottomGlow" cx="50%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <!-- Filter for subtle luxury glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Shadow behind metal bezel -->
  <circle cx="24" cy="24.5" r="22" fill="#000000" fill-opacity="0.45"/>

  <!-- Metallic Chrome Bezel Ring -->
  <circle cx="24" cy="24" r="22" fill="url(#metalRim)" stroke="#1e293b" stroke-width="0.75" filter="url(#softGlow)"/>

  <!-- Inner Dark Bezel Step -->
  <circle cx="24" cy="24" r="18" fill="#090d16" stroke="#0f172a" stroke-width="0.75"/>

  <!-- Green 3D Gem Dome -->
  <circle cx="24" cy="24" r="16.5" fill="url(#greenSphere)"/>
  <circle cx="24" cy="24" r="16.5" fill="url(#bottomGlow)"/>
  <circle cx="24" cy="24" r="16.5" fill="url(#innerRecess)"/>

  <!-- Glass Specular Highlight Oval -->
  <ellipse cx="24" cy="16.5" rx="10.5" ry="6" fill="url(#topGloss)"/>
</svg>