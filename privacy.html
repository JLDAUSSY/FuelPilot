          <p>This Privacy Policy applies to the <strong>FuelCoPilot</strong> application (Web App, PWA, and Android version on the Google Play Store), published by <strong>JLDApps</strong>.</p>

          <h2>1. Collection and Processing of Personal Data</h2>
          <p><strong>FuelCoPilot does not collect, store, or transmit any personally identifiable information.</strong></p>
          <ul>
            <li>No account registration is required.</li>
            <li>No names, email addresses, or phone numbers are requested or collected.</li>
            <li>No in-app purchase or payment gateway is integrated.</li>
          </ul>

          <h2>2. Location Data</h2>
          <p>FuelCoPilot may request access to your device's GPS location solely with your prior consent and strictly for:</p>
          <ul>
            <li>Centering the map on your current position.</li>
            <li>Calculating highway routes from your departure point to your destination.</li>
          </ul>
          <p><strong>Location data is processed strictly in local memory on your device.</strong> It is never transmitted to, recorded on, or retained by our servers, nor is it shared with third parties.</p>

          <h2>3. Cookies and Tracking</h2>
          <p>FuelCoPilot <strong>does not use advertising cookies, commercial profiling tools, or cross-application tracking SDKs</strong>.</p>
          <p>Browser local storage (localStorage) is used solely to store your display preferences (selected language, fuel type, and brand filters).</p>

          <h2>4. Data Sources and Third-Party Services</h2>
          <p>To provide accurate, real-time highway fuel prices, FuelCoPilot relies exclusively on official government open-data registries across 13 European countries:</p>
          <ul>
            <li><strong>Fuel Prices:</strong> Official open-data portals (France, Germany, Spain, Italy, Belgium, United Kingdom, Portugal, Netherlands, Luxembourg, Austria, Switzerland, Slovenia, and Croatia).</li>
            <li><strong>Maps:</strong> OpenStreetMap tiles and CARTO base maps.</li>
            <li><strong>Routing:</strong> Open Source Routing Machine (OSRM).</li>
          </ul>

          <h2>5. Security</h2>
          <p>All network traffic is encrypted end-to-end via <strong>HTTPS (TLS)</strong> protocols.</p>

          <h2>6. Your Rights (GDPR / Privacy Laws)</h2>
          <p>In full compliance with European GDPR and UK Data Protection laws, you retain total sovereignty over your data. Because no personal data is stored on remote servers, closing or uninstalling the app immediately deletes all locally stored preferences.</p>

          <h2>7. Contact</h2>

          <p><strong>Email:</strong> <a href="mailto:aquacheckjld@gmail.com" style="color:#38bdf8; text-decoration:none;">aquacheckjld@gmail.com</a></p>

    function getSelectedLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      if (urlLang && PRIVACY_TEXTS[urlLang.toLowerCase()]) {
        return urlLang.toLowerCase();
      }
      try {
        const stored = localStorage.getItem('fuelpilot_lang');
        if (stored && PRIVACY_TEXTS[stored.toLowerCase()]) {
          return stored.toLowerCase();
        }
      } catch (e) {}
      const navLang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
      return PRIVACY_TEXTS[navLang] ? navLang : 'fr';
    }

    function applyLanguage(lang) {
      const data = PRIVACY_TEXTS[lang] || PRIVACY_TEXTS.fr;
      document.documentElement.lang = lang;
      document.getElementById('doc-title').textContent = data.docTitle;
      document.getElementById('title-main').innerHTML = data.headerTitle;
      document.getElementById('badge-date').textContent = data.badgeDate;
      document.getElementById('content-body').innerHTML = data.html;
      const backBtn = document.getElementById('btn-back-app');
      backBtn.textContent = data.backBtn;
      backBtn.href = `index.html?lang=${lang}&_v=${Date.now()}`;

      const guideLink = document.getElementById('link-guide');
      if (guideLink) {
        guideLink.textContent = data.guideBtn || "📖 Mode d'emploi & Guide";
        guideLink.href = `guide.html?lang=${lang}`;
      }

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      try {
        localStorage.setItem('fuelpilot_lang', lang);
      } catch (e) {}
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;
        applyLanguage(lang);
      });
    });

    applyLanguage(getSelectedLanguage());
  </script>
